[project]
name = "louvorja-lite"
version = "0.1.1"
description = "Busca de hinos, liturgia semanal e modo de projeção, reaproveitando os dados do LouvorJA Desktop."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    # O seek do player depende de Range HTTP no FileResponse, que só existe a partir da 0.45.
    "starlette>=0.45",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
build = ["pyinstaller>=6.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
