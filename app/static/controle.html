<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LouvorJA Lite — Controle</title>
<link rel="stylesheet" href="/static/controle.css">
</head>
<body>
<header>
  <h1>LouvorJA Lite</h1>
  <div class="semana">
    <label for="semana">Semana</label>
    <input type="date" id="semana">
    <button id="abrir-projecao" type="button">Abrir Projeção</button>
  </div>
</header>

<main>
  <section class="busca">
    <h2>Buscar hino</h2>
    <div class="busca-controles">
      <input type="text" id="busca-input" placeholder="Número ou nome do hino...">
      <select id="busca-edicao">
        <option value="atual">Hinário atual</option>
        <option value="1996">Hinário 1996</option>
        <option value="tudo">Tudo (CDs/coletâneas)</option>
      </select>
    </div>
    <ul id="resultados"></ul>
  </section>

  <section class="liturgia">
    <h2>Liturgia da semana</h2>
    <ol id="itens-liturgia"></ol>
    <p id="liturgia-vazia" class="vazio">Nenhum item ainda — busque um hino e clique em
      "+ adicionar".</p>
  </section>
</main>

<footer id="barra-projecao">
  <div class="linha-superior">
    <span id="item-atual">Nenhum hino selecionado</span>
    <div class="navegacao">
      <button id="slide-anterior" type="button">◀ Anterior</button>
      <span id="slide-contador">0/0</span>
      <button id="slide-proximo" type="button">Próximo ▶</button>
    </div>
  </div>

  <div id="player" class="player" hidden>
    <button id="player-play" type="button" class="play" title="Tocar/pausar (P)">▶</button>

    <div class="faixas" role="group" aria-label="Faixa de áudio">
      <button id="faixa-cantado" type="button" class="faixa ativa">Cantado</button>
      <button id="faixa-playback" type="button" class="faixa">Playback</button>
    </div>

    <input type="range" id="player-progresso" min="0" max="0" step="0.1" value="0"
           aria-label="Posição da música">
    <span id="player-tempo" class="tempo">0:00 / 0:00</span>

    <label class="volume">
      <span aria-hidden="true">🔊</span>
      <input type="range" id="player-volume" min="0" max="1" step="0.01" value="1"
             aria-label="Volume">
    </label>

    <label class="seguir" title="O slide vira sozinho, no tempo gravado no banco">
      <input type="checkbox" id="player-seguir" checked>
      Seguir áudio
    </label>

    <span id="player-aviso" class="aviso" hidden></span>
  </div>

  <audio id="audio" preload="metadata"></audio>
</footer>

<script src="/static/controle.js"></script>
</body>
</html>
